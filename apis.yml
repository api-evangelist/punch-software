description: Punch! Software is a consumer and professional home, interior, and landscape design
  software company, describing itself as the number-one global brand in home design with over twenty
  years of market innovation. Its Punch! Home & Landscape Design product line lets homeowners, remodelers,
  and designers plan and visualize renovation projects in 3D across Windows and Mac, with tools for
  paint, flooring, stone, decks, patios, and blinds. The company was recapitalized by Insight Partners
  (formerly Insight Venture Partners) and is tracked in the API Evangelist network as a portfolio lead.
  It sells packaged desktop design software directly to retail and professional customers and publishes
  no public API, developer portal, or SDK at this time.
